<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Hagi's Pizzeria favicon">
  <defs>
    <linearGradient id="bg" x1="10" y1="6" x2="54" y2="58" gradientUnits="userSpaceOnUse">
      <stop stop-color="#B91C1C"/>
      <stop offset="1" stop-color="#7F1D1D"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="64" height="64" rx="16" fill="url(#bg)"/>

  <!-- pizza slice -->
  <path d="M18 13c13 0 23 5 32 15L24 52c-5-13-7-25-6-39Z" fill="#FBBF24" filter="url(#shadow)"/>
  <path d="M18 13c13 0 23 5 32 15l-4 4C38 23 29 19 19 19c-.6-2-.9-4-.8-6Z" fill="#FDE68A"/>
  <path d="M24 52 50 28c-2.5-2.8-5.1-5.1-7.9-7.1" fill="none" stroke="#92400E" stroke-width="2" stroke-linecap="round" opacity="0.35"/>

  <!-- toppings -->
