  <circle cx="40" cy="34" r="3.2" fill="#DC2626"/>
  <circle cx="29" cy="41" r="3" fill="#DC2626"/>
  <circle cx="35" cy="36" r="1.4" fill="#166534"/>
  <circle cx="25" cy="30" r="1.3" fill="#166534"/>

  <!-- H mark -->
  <path d="M18 22v23M29 22v23M19 33h9" fill="none" stroke="#FFFFFF" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
